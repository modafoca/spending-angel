# Spending Angel — CI (M-F1).
# Two halves, two jobs: the Swift menu-bar app builds + tests on macOS
# (macos-15 + DEVELOPER_DIR pinned to Xcode 16.4 — Swift 6.1.2, needed for the
# Swift Testing module); the extension's pure detection logic tests on Linux
# (fast + free).
name: CI

on:
  push:
  pull_request:

jobs:
  mac-app:
    name: macOS app (build + test)
    runs-on: macos-15
    env:
      # Pin the toolchain instead of trusting the image default (review 2026-09).
      # The image default is not a contract: macos-14 resolved to a toolchain
      # without the Swift Testing module and this job only went green once it
      # moved to macos-15 (commit fff0f1a). Xcode 16.4 = Swift 6.1.2, the version
      # run 34940554506 passed on. If the image ever drops this Xcode, the
      # "Swift version" step below fails immediately with a missing DEVELOPER_DIR
      # instead of a confusing test-time error.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        # A real assertion: the first line prints the toolchain for the log, the
        # second fails the job unless it is Swift 6.1.2. Anything else means the
        # pin above no longer matches the runner image — fix the pin, don't unpin.
        run: |
          swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.1\.2'
      - name: Build
        run: swift build --package-path mac-app
      - name: Test
        run: swift test --package-path mac-app
      - name: Bundle
        # The real install path, minus the copy into ~/Applications: a release
        # build wrapped into an ad-hoc-signed .app with its SwiftPM resource
        # bundle in place. Fails if the plist, the signature or the resources
        # ever drift from what install.sh expects.
        run: |
          scripts/bundle.sh
          codesign --verify --deep --strict "mac-app/.build/Spending Angel.app"
          test -d "mac-app/.build/Spending Angel.app/Contents/Resources/SpendingAngel_SpendingAngel.bundle"

  extension:
    name: Extension (detection tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node --test extension/tests/*.test.js
      - name: Script syntax
        # Cheap parse check of the install/update scripts on the Linux job; the
        # macOS job runs bundle.sh for real.
        run: bash -n scripts/*.sh
